---
start: porch

locations: 
  - label: road
    type: PATH
    name: a road
    description: a dusty road
    vistas:
      - direction: s se sw ne nw
        description: |
          a barbed wire fence.
          Beyond the fence you see pastures with woodlands beyond.
      - direction: n
        description: a high stone wall.
      - direction: e
        description: |
          the road runs off into the distance.
          In the distance you see trees and the roofs of buildings.
      - direction: w
        description: |
          the road runs off into the distance.

  - label: path
    type: PATH
    name: the front path
    description: the front path of the Spooky House.
    vistas:
      - direction: e
        description: | 
          a patch of long grass.
          In the grass you see the top of pillar.
          Beyond the patch of grass is a high stone wall.
      - direction: w
        description: | 
          a patch of long grass.
          Beyond the patch of grass is a high stone wall.
      - direction: s
        description: |
          the path ends with a high stone wall.

  - label: porch
    type: PLATFORM
    name: the front porch
    description: the front porch of the Spooky House

  - label: hallway
    type: PASSAGEWAY
    name: the hallway
    description: |
      an entrance hallway
    walls:
      - direction: e
        name: east wall
        description: a long wall with a doorway
      - direction: w
        name: west wall
        description: a long wall with a doorway

  - label: dining
    type: ROOM
    name: the dining room
    description: |
      a room with a large window.  
      In the center of the room is a dining table with 6 chairs.
    walls:
      - direction: e
        name: east wall
        description: a blank wall
      - direction: w
        name: west wall
        description: a wall with a doorway
      - direction: s
        name: south wall
        description: a wall with a window
      - direction: n
        name: north wall
        description: a blank wall

  - label: sitting
    type: ROOM
    name: the sitting room
    description: |
      a room with a large window and fireplace.  
      In front of the fireplace is a sofa and 2 armchairs.
    walls:
      - direction: e
        name: east wall
        description: a wall with a doorway
      - direction: w
        name: west wall
        description: a wall with a fireplace
      - direction: s
        name: south wall
        description: a wall with a window
      - direction: n
        name: north wall
        description: a blank wall

exits:

  - from: road
    to: path
    portal:
      label: frontgate
      name: the front date
      abbrev: gate
      description: a rustic gate
      flags: OPENABLE OPEN
    forwards: n i
    backwards: s o
 
  - from: path
    to: porch
    forwards: n
    backwards: s

  - from: porch
    to: hallway
    portal:
      label: frontdoor
      name: the front door
      abbrev: door
      description: an ornate oak door
      flags: OPENABLE LOCKABLE
    forwards: n i
    backwards: s o

  - from: hallway
    to: dining
    forwards: e
    backwards: w

  - from: hallway
    to: sitting
    forwards: w
    backwards: e
    
items:
  - label: knapsack
    kind: CONTAINER
    name: your knapsack
    description: a nondescript grey canvas knapsack.
    location: porch
    flags: WEARABLE MOVEABLE TAKEABLE
    contents:
      - label: sandwich
        name: a vegemite sandwich
        description: The sandwich looks fresh
        flags: EDIBLE
        triggers:
          - events: CONSUMED
            message: Nom nom nom
  
  - label: fireplace
    name: a fireplace
    description: | 
      a large stone fireplace.
      In the fireplace are the cold ashes from a fire.
    location: sitting#w
    flags: 
        
  - label: sofa
    name: a sofa
    description: an sofa upholstered in green fabric.
    location: sitting
    flags: MOVEABLE
        
  - label: doormat
    name: a doormat
    abbrev: mat
    description: an old doormat with the words 'Not Welcome' on it.
    location: porch
    flags: MOVEABLE 
    triggers:
      - events: MOVED SEARCHED
        target: doorkey
        verb: REVEAL
        message: Under the doormat you see a key
              
  - label: doorkey
    name: a shiny key
    abbrev: key
    location: porch
    flags: HIDDEN TAKEABLE
    
  - label: chest
    kind: CONTAINER
    name: a chest
    description: a large iron-bound wooden chest 
    location: sitting
    flags: OPENABLE LOCKABLE LOCKED
    associations:
      - association: HAS_KEY
        item: chestkey
    
  - label: chestkey
    name: a rusty iron key
    abbrev: key
    location: sitting
    flags: TAKEABLE
    
  - label: chair1
    name: an armchair
    abbrev: armchair
    description: | 
        an armchair upholstered in green fabric.
        There are rusty stains on the chair's seat, back and arms.
    location: sitting
    flags: MOVEABLE 
    triggers:
      - events: MOVED SEARCHED
        message: |
          There is a lot of dust under the armchair.
          Written in the dust are the words "He kiiled me!".

  - label: chair2
    name: an armchair
    abbrev: armchair
    description: an armchair upholstered in green fabric.
    location: sitting
    flags: MOVEABLE 
    
associations:
  - relation: HAS_KEY
    item1: frontdoor
    item2: doorkey
    
  - relation: HAS_KEY
    item1: chest
    item2: chestkey
