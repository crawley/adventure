---
start: porch

locations: 
  - label: road
    type: PATH
    name: a road
    description: a dusty road
    vistas:
      - direction: s se sw
        description: |
          a barbed wire fence.
          Beyond the fence you see pastures with woodlands beyond.
      - direction: n
        description: a high stone wall.
      - direction: ne nw
        description: a corner of the high stone wall.
      - direction: e
        description: |
          the road runs off into the distance.
          In the distance you see trees and the roofs of buildings.
      - direction: w
        description: |
          the road runs off into the distance.

  - label: path
    type: PATH
    name: the front path
    description: the front path of the Spooky House.
    vistas:
      - direction: e
        description: | 
          a patch of long grass.
          In the grass you see the top of pillar.
          Beyond the patch of grass is a high stone wall.
      - direction: w
        description: | 
          a patch of long grass.
          Beyond the patch of grass is a high stone wall.
      - direction: s
        description: |
          the path ends with a high stone wall.

  - label: porch
    type: PLATFORM
    name: the front porch
    description: the front porch of the Spooky House

  - label: hallway
    type: PASSAGEWAY
    name: the hallway
    description: |
      an entrance hallway
    walls:
      - direction: s
        name: south wall
        description: a short wall with a doorway
      - direction: e
        name: east wall
        description: a long wall with a doorway
      - direction: w
        name: west wall
        description: a long wall with a doorway

  - label: dining
    type: ROOM
    name: the dining room
    description: |
      a room with a large window.  
      In the center of the room is a dining table with 6 chairs.
    walls:
      - direction: e
        name: east wall
        description: a blank wall
      - direction: w
        name: west wall
        description: a wall with a doorway
      - direction: s
        name: south wall
        description: a wall with a window
      - direction: n
        name: north wall
        description: a blank wall

  - label: sitting
    type: ROOM
    name: the sitting room
    description: |
      a room with a large window and fireplace.  
      In front of the fireplace is a sofa and 2 armchairs.
    walls:
      - direction: e
        name: east wall
        description: a wall with a doorway
      - direction: w
        name: west wall
        description: a wall with a fireplace
      - direction: s
        name: south wall
        description: a wall with a window
      - direction: n
        name: north wall
        description: a blank wall

  - label: corridor
    type: ROOM
    name: the downstairs corridor
    description: |
        a corridor running east-west.  
    walls:
      - direction: e
        name: east wall
        description: |
          the east end of the corridor.
          There is a small window in the wall.
      - direction: w
        name: west wall
        description: |
          the west end of the corridor.
          There is a small window in the wall.
      - direction: s
        name: south wall
        description: the south side of the corridor
      - direction: n
        name: north wall
        description: the north side of the corridor
        
  - label: corridor-e
    type: ROOM
    name: the downstairs corridor
    description: |
        the east end of a corridor running east-west.
    walls:
      - direction: e
        name: east wall
        description: |
          the east end of the corridor.
          There is a small window in the wall.
          The window is too dirty to see through.
      - direction: w
        name: west wall
        description: |
          the west end of the corridor.
      - direction: s
        name: south wall
        description: the south side of the corridor
      - direction: n
        name: north wall
        description: the north side of the corridor

  - label: corridor-w
    type: ROOM
    name: the downstairs corridor
    description: the west end of a corridor running east-west.
    walls:
      - direction: e
        name: east wall
        description: |
          the east end of the corridor.
      - direction: w
        name: west wall
        description: |
          the west end of the corridor        .
          There is a small window in the wall.
          The window is too dirty to see through.
      - direction: s
        name: south wall
        description: the south side of the corridor
      - direction: n
        name: north wall
        description: the north side of the corridor
        
  - label: kitchen
    type: ROOM
    name: the kitchen
    description: an old fashioned kitchen 
    walls:
      - direction: s
        name: south wall
        description: the south wall of the kitchen
      - direction: n
        name: north wall
        description: |
          the north wall of the kitchen.
          There is a large window with a view to the outside.
          Beneath the window is a benchtop with a sink and cupboard below it. 
      - direction: e
        name: east wall
        description: |
          the east wall of the kitchen.
          The wall is dominated by an large iron stove.
      - direction: w
        name: west wall
        description: the west wall of the kitchen
        
  - label: pantry
    type: ROOM
    name: the pantry
    description: |
      a small room with floor to ceiling shelves on three walls.
      There are empty boxes on the shelves.
        
exits:

  - from: road
    to: path
    portal:
      label: frontgate
      name: the front gate
      abbrev: gate
      description: an old wooden gate
      flags: OPENABLE
      triggers: 
        - events: OPENED
          actions:
            - verb: MESSAGE
              message: The gate collapses.
              onetime: Y
            - verb: CLEAR_FLAG
              arg: OPENABLE
              onetime: Y
            - verb: SET_DESCRIPTION
              arg: a collaped gate that will no longer close
              onetime: Y
    forwards: n i
    backwards: s o
 
  - from: path
    to: porch
    forwards: n
    backwards: s

  - from: porch
    to: hallway
    portal:
      label: frontdoor
      name: the front door
      abbrev: door
      description: an ornate oak door
      flags: OPENABLE LOCKABLE
    forwards: n i
    backwards: s o

  - from: hallway
    to: dining
    forwards: e
    backwards: w

  - from: hallway
    to: sitting
    forwards: w
    backwards: e
    
  - from: hallway
    to: corridor
    forwards: n
    backwards: s

  - from: corridor
    to: corridor-e
    forwards: e
    backwards: w
    
  - from: corridor
    to: corridor-w
    forwards: w
    backwards: e
    
  - from: corridor-e
    to: kitchen
    portal:
      label: kitchendoor
      name: the kitchen door
      abbrev: door
      description: an plain door
      flags: OPENABLE
      triggers:
        - events: OPENED
          actions:
            - verb: MESSAGE
              message: The door creaks as it opens.
        - events: CLOSED
          actions:
            - verb: MESSAGE
              message: The door creaks as it closes.
    forwards: n
    backwards: s

  - from: kitchen
    to: pantry
    forwards: w
    backwards: e
    
actor_templates:
  - label: creature
    properties:
      - name: health
        type: int
        initial: 100
        min: 0
        max: 100
      - name: hunger
        type: int
        initial: 5
        min: 0
        max: 10
    triggers:
      - events: TICK
        actions:
          - verb: INCREMENT
            arg: hunger
  - label: player
    base: creature
    properties:
      - name: strength
        type: int
        initial: 12
        min: 6
        max: 18
      - name: dexterity
        type: int
        initial: 12
        min: 6
        max: 18
      - name: intelligence
        type: int
        initial: 12
        min: 6
        max: 18
      - name: wisdom
        type: int
        initial: 12
        min: 6
        max: 18
      - name: constitution
        type: int
        initial: 12
        min: 6
        max: 18
      - name: charisma
        type: int
        initial: 12
        min: 6
        max: 18
 
creatures:
  - label: cat
    base: creature
    kind: PET
    name: Jasper
    abbrev: cat
    description: a black cat
    location: kitchen
    properties:
      - name: hunger
        type: int
        initial: 5
        min: 0
        max: 10
    triggers:
      - events: TICK
        actions:
          - verb: TEST_MAX
            arg: hunger
          - verb: SAY
            message: "Meow"
      - events: PETTED
        actions:
          - verb: SAY
            message: "Purr"
      - events: ATE
        actions:
          - verb: TEST_RELATED
            arg: LIKES
          - verb: SAY
            message: "Mraow!"
      - events: ATE
        actions:
          - verb: TEST_UNRELATED
            arg: LIKES
          - verb: MESSAGE
            message: The cat sniffs the food and backs away.
            
item_templates:
  - label: food
    properties:
      - name: calories
        type: int
        initial: 10
    triggers:
      - events: CONSUMED
        actions:
          - verb: MESSAGE
            arg: The food is consumed.
          - verb: DESTROY
          
  - label: cannedfood
    base: food
    triggers:
      - events: CONSUMED
        override: Y
        actions:
          - verb: SET_DESCRIPTION
            arg: an empty can
          - verb: SET_NAME
            arg: an empty can
          - verb: MESSAGE
            arg: The food is consumed.
          - verb: SET_PROPERTY
            arg: calories
            arg2: 0

items:
  - label: knapsack
    kind: CONTAINER
    name: your knapsack
    description: a nondescript grey canvas knapsack.
    location: porch
    flags: WEARABLE MOVEABLE TAKEABLE
    contents:
      - label: sandwich
        base: food
        name: a vegemite sandwich
        description: The sandwich looks fresh
        flags: MOVEABLE TAKEABLE EDIBLE
        triggers:
          - events: CONSUMED
            override: Y
            actions:
              - verb: SET_DESCRIPTION
                arg: an old sandwich wrapper
              - verb: SET_NAME
                arg: some rubbish
              - verb: SET_ABBREV
                arg: rubbish
              - verb: SET_PROPERTY
                arg: calories
                arg2: 0
  
  - label: coatstand
    kind: CONTAINER
    name: a coat stand
    description: an old fashioned coat stand
    location: hallway#s
    flags: MOVEABLE
    contents:
      - label: cap
        name: a red baseball cap
        flags: WEARABLE MOVEABLE TAKEABLE EDIBLE
        description: |
          The cap has the words "Make Arcadia Great Again" on the front.
          
  - label: kitchendrawer
    kind: CONTAINER
    name: a kichen drawer
    abbrev: drawer
    location: kitchen#n
    flags: OPENABLE
    contents:
      - label: kitchenknife
        name: a kitchen knife
        abbrev: knife
        description: a small kitchen knife with a wooden handle.
        flags: MOVEABLE TAKEABLE
      - label: canopener
        name: a can opener
        description: a rusty can opener
        flags: MOVEABLE TAKEABLE
    
  - label: fireplace
    name: a fireplace
    description: | 
      a large stone fireplace.
      In the fireplace are the cold ashes from a fire.
    location: sitting#w
    flags: 
        
  - label: sofa
    name: a sofa
    description: an sofa upholstered in green fabric.
    location: sitting
    flags: MOVEABLE
        
  - label: doormat
    name: a doormat
    abbrev: mat
    description: an old doormat with the words 'Not Welcome' on it.
    location: porch
    flags: MOVEABLE 
    triggers:
      - events: MOVED SEARCHED
        actions:
          - verb: REVEAL
            onetime: Y
            target: doorkey
          - verb: MESSAGE
            onetime: Y
            message: Under the doormat you see a key
              
  - label: doorkey
    name: a shiny key
    abbrev: key
    location: porch
    flags: TAKEABLE
    properties:
      - name: hidden
        type: boolean
        initial: Y
    
  - label: chest
    kind: CONTAINER
    name: a chest
    description: a large iron-bound wooden chest 
    location: sitting
    flags: MOVEABLE OPENABLE LOCKABLE
    properties:
      - name: locked
        type: boolean
        initial: Y
    
  - label: chestkey
    name: a rusty iron key
    abbrev: key
    location: sitting
    flags: MOVEABLE TAKEABLE
    
  - label: chair1
    name: an armchair
    abbrev: armchair
    description: | 
        an armchair upholstered in green fabric.
        There are rusty stains on the chair's seat, back and arms.
    location: sitting
    flags: MOVEABLE 
    triggers:
      - events: MOVED SEARCHED
        actions:
          - verb: MESSAGE
            onetime: Y
            message: |
              There is a lot of dust under the armchair.
              Written in the dust are the words "He kiiled me!".
              A sudden draft scatters the dust.

  - label: chair2
    name: an armchair
    abbrev: armchair
    description: an armchair upholstered in green fabric.
    location: sitting
    flags: MOVEABLE
    
  - label: catfood
    base: cannedfood
    name: a can of cat food
    abbrev: can
    description: a can of a budget brand of catfood
    flags: MOVEABLE OPENABLE TAKEABLE EDIBLE
    location: pantry
    
  - label: tuna
    base: cannedfood
    name: a can of tuna
    abbrev: can
    description: |
      a can of tuna.
      The label says that the tuna is "dolphin friendly".
    flags: MOVEABLE OPENABLE TAKEABLE EDIBLE
    location: pantry
    properties:
      - name: calories
        type: int
        initial: 20

  - label: beans
    base: cannedfood
    name: a can of baked beans
    abbrev: can
    description: |
      this is a can of baked beans.
      It is only worth ...  a can of beans.
    flags: MOVEABLE OPENABLE TAKEABLE EDIBLE
    location: pantry

  - label: spam
    base: cannedfood
    name: a can of potted meat
    abbrev: can
    description: |
      this is a can of SPAM(tm).
      The can's label shows a picture of a Viking chorus.
    flags: MOVEABLE OPENABLE TAKEABLE EDIBLE
    location: pantry

  - label: spinach
    base: cannedfood
    name: a can of spinach
    abbrev: can
    description: |
       this is a can of spinach.
       The label shows a picture of a sailor.
    flags: MOVEABLE OPENABLE TAKEABLE EDIBLE
    location: pantry
    properties:
      - name: calories
        type: int
        initial: 100

associations:
  - relation: HAS_KEY
    entity1: frontdoor
    entity2: doorkey
    
  - relation: HAS_KEY
    entity1: chest
    entity2: chestkey
    
  - relation: HAS_OPENER
    entity1: catfood
    entity2: canopener
    
  - relation: HAS_OPENER
    entity1: tuna
    entity2: canopener

  - relation: HAS_OPENER
    entity1: beans
    entity2: canopener
      
  - relation: HAS_OPENER
    entity1: spam
    entity2: canopener
    
  - relation: LIKES
    entity1: cat
    entity2: catfood

  - relation: LIKES
    entity1: cat
    entity2: tuna
        
