---
start: porch

locations: 
  - label: road
    type: PATH
    name: a road
    description: a dusty road
    vistas:
      - direction: s se sw
        description: |
          a barbed wire fence.
          Beyond the fence you see pastures with woodlands beyond.
      - direction: n
        description: a high stone wall.
      - direction: ne nw
        description: a corner of the high stone wall.
      - direction: e
        description: |
          the road runs off into the distance.
          In the distance you see trees and the roofs of buildings.
      - direction: w
        description: |
          the road runs off into the distance.

  - label: path
    type: PATH
    name: the front path
    description: the front path of the Spooky House.
    vistas:
      - direction: e
        description: | 
          a patch of long grass.
          In the grass you see the top of pillar.
          Beyond the patch of grass is a high stone wall.
      - direction: w
        description: | 
          a patch of long grass.
          Beyond the patch of grass is a high stone wall.
      - direction: s
        description: |
          the path ends with a high stone wall.

  - label: porch
    type: PLATFORM
    name: the front porch
    description: the front porch of the Spooky House

  - label: hallway
    type: PASSAGEWAY
    name: the hallway
    description: |
      an entrance hallway
    walls:
      - direction: s
        name: south wall
        description: a short wall with a doorway
      - direction: e
        name: east wall
        description: a long wall with a doorway
      - direction: w
        name: west wall
        description: a long wall with a doorway

  - label: dining
    type: ROOM
    name: the dining room
    description: |
      a room with a large window.  
      In the center of the room is a dining table with 6 chairs.
    walls:
      - direction: e
        name: east wall
        description: a blank wall
      - direction: w
        name: west wall
        description: a wall with a doorway
      - direction: s
        name: south wall
        description: a wall with a window
      - direction: n
        name: north wall
        description: a blank wall

  - label: sitting
    type: ROOM
    name: the sitting room
    description: |
      a room with a large window and fireplace.  
      In front of the fireplace is a sofa and 2 armchairs.
    walls:
      - direction: e
        name: east wall
        description: a wall with a doorway
      - direction: w
        name: west wall
        description: a wall with a fireplace
      - direction: s
        name: south wall
        description: a wall with a window
      - direction: n
        name: north wall
        description: a blank wall

exits:

  - from: road
    to: path
    portal:
      label: frontgate
      name: the front gate
      abbrev: gate
      description: a rustic gate
      flags: OPENABLE
      triggers: 
        - events: OPENED
          actions:
            - verb: MESSAGE
              message: The gate collapses.
              onetime: Y
            - verb: CLEAR_FLAG
              arg: OPENABLE
              onetime: Y
            - verb: SET_DESCRIPTION
              arg: a collaped gate that will no longer close
              onetime: Y
    forwards: n i
    backwards: s o
 
  - from: path
    to: porch
    forwards: n
    backwards: s

  - from: porch
    to: hallway
    portal:
      label: frontdoor
      name: the front door
      abbrev: door
      description: an ornate oak door
      flags: OPENABLE LOCKABLE
    forwards: n i
    backwards: s o

  - from: hallway
    to: dining
    forwards: e
    backwards: w

  - from: hallway
    to: sitting
    forwards: w
    backwards: e
    
creatures:
  - label: jasper
    kind: PET
    name: Jasper
    abbrev: cat
    description: a black cat
    location: path
    properties:
      - name: hunger
        type: int
        initial: "5"
        min: "0"
        max: "10"
    triggers:
      - events: TICK
        actions:
          - verb: INCREMENT
            arg: hunger
          - verb: TEST_MAX
            arg: hunger
          - verb: SAY
            message: "Meow"
      - events: PETTED
        actions:
          - verb: SAY
            message: "Purr"
      - events: CONSUMED
        actions:
          - verb: SAY
            message: "Mraow!"
    
items:
  - label: knapsack
    kind: CONTAINER
    name: your knapsack
    description: a nondescript grey canvas knapsack.
    location: porch
    flags: WEARABLE MOVEABLE TAKEABLE
    contents:
      - label: sandwich
        name: a vegemite sandwich
        description: The sandwich looks fresh
        flags: EDIBLE
        properties:
          - name: calories
            type: int
            initial: "10"
        triggers:
          - events: CONSUMED
            actions:
            - verb: THINK
              message: "Nom nom nom"
  
  - label: coatstand
    kind: CONTAINER
    name: a coat stand
    description: an old fashioned coat stand
    location: hallway#s
    flag: MOVEABLE
    contents:
      - label: cap
        name: a red baseball cap
        flags: WEARABLE MOVEABLE TAKEABLE 
        description: |
          The cap has the words "Make Arcadia Great Again" on the front.
    
  - label: fireplace
    name: a fireplace
    description: | 
      a large stone fireplace.
      In the fireplace are the cold ashes from a fire.
    location: sitting#w
    flags: 
        
  - label: sofa
    name: a sofa
    description: an sofa upholstered in green fabric.
    location: sitting
    flags: MOVEABLE
        
  - label: doormat
    name: a doormat
    abbrev: mat
    description: an old doormat with the words 'Not Welcome' on it.
    location: porch
    flags: MOVEABLE 
    triggers:
      - events: MOVED SEARCHED
        actions:
          - verb: REVEAL
            onetime: Y
            target: doorkey
          - verb: MESSAGE
            onetime: Y
            message: Under the doormat you see a key
              
  - label: doorkey
    name: a shiny key
    abbrev: key
    location: porch
    flags: TAKEABLE
    properties:
      - name: hidden
        type: boolean
        initial: Y
    
  - label: chest
    kind: CONTAINER
    name: a chest
    description: a large iron-bound wooden chest 
    location: sitting
    flags: OPENABLE LOCKABLE
    properties:
      - name: locked
        type: boolean
        initial: Y

    associations:
      - association: HAS_KEY
        item: chestkey
    
  - label: chestkey
    name: a rusty iron key
    abbrev: key
    location: sitting
    flags: TAKEABLE
    
  - label: chair1
    name: an armchair
    abbrev: armchair
    description: | 
        an armchair upholstered in green fabric.
        There are rusty stains on the chair's seat, back and arms.
    location: sitting
    flags: MOVEABLE 
    triggers:
      - events: MOVED SEARCHED
        actions:
          - verb: MESSAGE
            onetime: Y
            message: |
              There is a lot of dust under the armchair.
              Written in the dust are the words "He kiiled me!".
              A sudden draft scatters the dust.

  - label: chair2
    name: an armchair
    abbrev: armchair
    description: an armchair upholstered in green fabric.
    location: sitting
    flags: MOVEABLE 
    
associations:
  - relation: HAS_KEY
    item1: frontdoor
    item2: doorkey
    
  - relation: HAS_KEY
    item1: chest
    item2: chestkey
